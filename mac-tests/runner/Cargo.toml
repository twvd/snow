[package]
name = "atalk-runner"
version = "0.1.0"
edition = "2024"

# Not part of the Snow workspace: building it there would turn on the
# test-only AppleTalk features for every other package built alongside.
[workspace]

[dependencies]
anyhow = "1.0.97"
env_logger = "0.11.8"
log = "0.4.27"
png = "0.17.16"
snow_core = { path = "../../core", features = ["mmap", "afp_server", "afp_server_test"] }

[features]
# LLAP/DDP wire dumps in the log
wire_debug = ["snow_core/afp_server_debug"]
